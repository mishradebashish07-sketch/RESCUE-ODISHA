<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rescue Odisha - Citizen SOS</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 420px; background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h1 { margin: 0 0 6px; font-size: 24px; text-align: center; color: #38bdf8; }
    p.sub { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; margin: 12px 0 4px; color: #cbd5e1; }
    input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; box-sizing: border-box; }
    .gps-box { margin-top: 12px; padding: 10px; border-radius: 8px; background: #0f172a; font-size: 13px; color: #38bdf8; text-align: center; }
    button.sos-btn { width: 100%; margin-top: 20px; padding: 16px; font-size: 18px; font-weight: bold; background: #dc2626; color: white; border: none; border-radius: 12px; cursor: pointer; }
    button.sos-btn:disabled { background: #7f1d1d; }
    #status { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
    .ok { background: #064e3b; color: #a7f3d0; }
    .err { background: #7f1d1d; color: #fecaca; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌊 RESCUE ODISHA</h1>
    <p class="sub">Emergency Citizen SOS (Odia / English)</p>

    <div class="gps-box" id="gpsStatus">📍 Detecting GPS location...</div>

    <label>Phone Number</label>
    <input type="tel" id="phone" placeholder="+91 9876543210" required />

    <label>Emergency Type</label>
    <select id="category">
      <option value="flood_evacuation">Flood Evacuation (ବନ୍ୟା)</option>
      <option value="medical_emergency">Medical Emergency (ଚିକିତ୍ସା)</option>
      <option value="cyclone_shelter">Cyclone Shelter (ବାତ୍ୟା ଆଶ୍ରୟସ୍ଥଳ)</option>
    </select>

    <label>What happened? (Write in Odia or English)</label>
    <textarea id="message" rows="3" placeholder="e.g., ଛାତ ଉପରେ ୪ ଜଣ ଫସିଛନ୍ତି / 4 people trapped on roof"></textarea>

    <button class="sos-btn" id="sosBtn" onclick="sendSOS()">🚨 SEND SOS NOW</button>
    <div id="status"></div>
  </div>

  <script>
    const API_URL = "https://rescue-odisha.onrender.com/api/v1/sos/triage";
    let lat = null, lon = null;

    // Auto-fetch GPS on page load
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          lat = pos.coords.latitude;
          lon = pos.coords.longitude;
          document.getElementById("gpsStatus").innerText = `📍 GPS Locked: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
        },
        () => {
          document.getElementById("gpsStatus").innerText = "⚠️ GPS denied. Please enable location permissions.";
        },
        { enableHighAccuracy: true }
      );
    }

    async function sendSOS() {
      const btn = document.getElementById("sosBtn");
      const statusBox = document.getElementById("status");
      if (lat === null || lon === null) {
        statusBox.className = "err";
        statusBox.style.display = "block";
        statusBox.innerText = "Waiting for GPS lock. Please allow location access.";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Sending SOS...";

      const payload = {
        reporter_contact: document.getElementById("phone").value || "Unknown",
        message: document.getElementById("message").value || "Emergency SOS",
        latitude: lat,
        longitude: lon,
        category: document.getElementById("category").value,
        severity_score: 5
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          const team = data.assigned_team ? data.assigned_team.team_name : "Queued for next unit";
          const shelter = data.nearest_shelter ? data.nearest_shelter.name : "N/A";
          statusBox.className = "ok";
          statusBox.innerHTML = `<b>✅ SOS Received (${data.status})</b><br>Rescue Team: ${team}<br>Nearest Shelter: ${shelter}`;
        } else {
          statusBox.className = "err";
          statusBox.innerText = `Error: ${data.detail || res.status}`;
        }
      } catch (e) {
        statusBox.className = "err";
        statusBox.innerText = "Network error. Could not reach Rescue Odisha server.";
      } finally {
        statusBox.style.display = "block";
        btn.disabled = false;
        btn.innerText = "🚨 SEND SOS NOW";
      }
    }
  </script>
</body>
</html>
